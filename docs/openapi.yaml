openapi: 3.2.0
info:
  title: Minecraft Player Lookup API
  description: |
    A high-availability API for resolving Minecraft players by username or UUID,
    backed by multiple third-party endpoints.

    ## Behavior
    - **Resolvers**: Mojang, PlayerDB, Ashcon, and Mowojang, run concurrently (`race`)
      or sequentially (`fallback`), as configured server-side.
    - **Caching**: results are cached in Redis; conclusive not-found verdicts are
      negative-cached briefly and served without contacting upstreams.
    - **Coalescing**: concurrent requests for the same identifier are deduplicated
      via singleflight and share one upstream lookup.
    - **CORS**: all origins allowed, methods `GET`/`OPTIONS`; the custom response
      headers `X-Cache-Status`, `X-Resolver`, and `X-Coalesced` are exposed to browsers.

    ## Errors
    A NOT_FOUND quorum across resolvers takes precedence over rate-limit, timeout,
    and upstream errors. Unknown paths return `404` with code `ENDPOINT_NOT_FOUND`,
    non-GET methods on known paths return `405` with code `METHOD_NOT_ALLOWED`.

    The Swagger UI and this spec are served only when the server runs with `app.env: dev`.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /api/v1
    description: API v1

paths:
  /player/{identifier}:
    get:
      summary: Look up a Minecraft player by username or UUID
      description: |
        Resolves a Minecraft player by username or UUID and returns both values.

        - Provide a **username** (3–16 alphanumeric/underscore characters) to get the UUID
        - Provide a **UUID** (with or without dashes) to get the current username

        Lookups are case-insensitive. Results are cached; concurrent requests for the
        same identifier are automatically coalesced.
      operationId: getPlayer
      tags:
        - Player
      parameters:
        - name: identifier
          in: path
          required: true
          description: Minecraft username (3–16 chars, `[a-zA-Z0-9_]`) or UUID (with or without dashes)
          schema:
            type: string
          examples:
            username:
              value: Notch
              summary: Lookup by username
            uuid_dashed:
              value: 069a79f4-44e9-4726-a5be-fca90e38aaf5
              summary: Lookup by UUID (dashed)
            uuid_plain:
              value: 069a79f444e94726a5befca90e38aaf5
              summary: Lookup by UUID (without dashes)
      responses:
        '200':
          description: Player found successfully
          headers:
            Cache-Control:
              schema:
                type: string
              description: Standard HTTP cache directive, e.g. `public, max-age=300`. Absent when player caching is disabled.
            X-Cache-Status:
              schema:
                type: string
                enum: [HIT, MISS]
              description: Whether the result was served from cache
            X-Resolver:
              schema:
                type: string
              description: The resolver that sourced the data (present on both HIT and MISS)
            X-Coalesced:
              schema:
                type: string
                enum: ["true"]
              description: |
                Present and set to "true" if this request was part of a coalesced group.
                Concurrent lookups for the same identifier share a single result via singleflight,
                so both deduplicated followers **and** the leader that executed the shared lookup
                receive this header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerResponse'
              example:
                success: true
                data:
                  uuid: "069a79f4-44e9-4726-a5be-fca90e38aaf5"
                  username: "Notch"
        '400':
          description: Invalid input — not a valid Minecraft username or UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "INVALID_INPUT"
                  message: "Invalid identifier 'a': must be a valid Minecraft username (3-16 chars) or UUID"
        '404':
          description: >
            The configured NOT_FOUND quorum (resolver.not_found_min_count) was reached, or every consulted
            resolver reported not found. Resolution stops as soon as the quorum reports NOT_FOUND and any
            in-flight lookups are cancelled. Conclusive not-found verdicts are negative-cached briefly
            (cache.negative_ttl) and served without contacting upstreams. The message is always
            "Player not found"; a cached verdict is indicated by X-Cache-Status: HIT.
          headers:
            Cache-Control:
              schema:
                type: string
              description: '`public, max-age=<seconds>` with the remaining negative-cache TTL. Absent when negative caching is disabled.'
            X-Cache-Status:
              schema:
                type: string
                enum: [HIT, MISS]
              description: '`HIT` for a cached not-found verdict, `MISS` for a fresh one.'
            X-Resolver:
              schema:
                type: string
              description: >
                Comma-separated resolvers that reported NOT_FOUND, e.g. `mojang,playerdb,ashcon`.
                Present on fresh and cached verdicts; cached responses carry the stored list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "NOT_FOUND"
                  message: "Player not found"
        '405':
          description: Method not allowed — only GET is supported on this path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "METHOD_NOT_ALLOWED"
                  message: "Method Not Allowed"
        '429':
          description: >
            Rate-limit failures occurred and the configured NOT_FOUND quorum was not reached.
            The message reports how many resolvers were affected, e.g. "Rate limiting affected
            1 of 4 resolvers" (or "affected all 4 resolvers").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "RATE_LIMITED"
                  message: "Rate limiting affected 1 of 4 resolvers"
        '500':
          description: Internal server error — misconfiguration or unexpected failure (including recovered panics)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Unexpected internal error
                  value:
                    success: false
                    error:
                      code: "INTERNAL_SERVER_ERROR"
                      message: "Internal server error"
                no_resolvers:
                  summary: No resolvers configured
                  value:
                    success: false
                    error:
                      code: "NO_RESOLVERS_AVAILABLE"
                      message: "No resolvers available"
        '502':
          description: Upstream error — external APIs returned unexpected or error responses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "UPSTREAM_ERROR"
                  message: "All resolver attempts failed"
        '504':
          description: >
            Resolver timeouts occurred, no rate limit took precedence, and the configured NOT_FOUND
            quorum was not reached. The message reports how many resolvers were affected,
            e.g. "Timeouts affected 1 of 4 resolvers" (or "affected all 4 resolvers").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: "TIMEOUT"
                  message: "Timeouts affected 1 of 4 resolvers"

components:
  schemas:
    PlayerResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Always true for successful responses
          example: true
        data:
          $ref: '#/components/schemas/PlayerData'

    PlayerData:
      type: object
      required:
        - uuid
        - username
      properties:
        uuid:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The player's UUID in dashed lowercase format
          example: "069a79f4-44e9-4726-a5be-fca90e38aaf5"
        username:
          type: string
          minLength: 3
          maxLength: 16
          description: The player's current username
          example: "Notch"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          description: Always false for error responses
          example: false
        error:
          $ref: '#/components/schemas/ErrorResult'

    ErrorResult:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_INPUT
            - NOT_FOUND
            - ENDPOINT_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - RATE_LIMITED
            - UPSTREAM_ERROR
            - TIMEOUT
            - NO_RESOLVERS_AVAILABLE
            - INTERNAL_SERVER_ERROR
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message

tags:
  - name: Player
    description: Player lookup operations
