services:
  app:
    build: .
    image: mc-lookup:latest
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "${APP_PORT:-8080}:8080"
    environment:
      REDIS_ADDR: vps3:6379
      API_PORT: "8080"
      # Uncomment to disable the Swagger endpoints (/ and /api/openapi.yaml):
      # APP_ENV: prod
    volumes:
      # Your local config wins over the baked-in example config.
      - ./config.yaml:/app/config.yaml:ro
