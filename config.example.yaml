app:
  name: mc-lookup
  env: dev

api:
  port: 8080
  read_timeout: 5
  write_timeout: 5

redis:
  addr: localhost:6379
  password: ""
  db: 0

resolver:
  timeout: 5
  user_agent: "mc-lookup/1.0"
  strategy: "fallback" # race | fallback (default: fallback when omitted)
  fallback_resolver_order: # used when strategy=fallback
    - mojang
    - playerdb
    - ashcon
    - mowojang
  race_resolver: # used when strategy=race (acts as resolver toggle list)
    - mojang
    - playerdb
    - ashcon
    - mowojang

cache:
  ttl: 3600
  prefix: "mc-lookup:"