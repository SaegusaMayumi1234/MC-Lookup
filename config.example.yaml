app:
  name: mc-lookup
  env: dev

api:
  port: 8080
  read_timeout: 5
  write_timeout: 30
  idle_timeout: 60

redis:
  addr: localhost:6379
  password: ""
  db: 0
  max_retries: -1
  op_timeout: 1

resolver:
  timeout: 5
  user_agent: "mc-lookup/1.0"
  strategy: "fallback"
  list:
    - mojang
    - playerdb
    - ashcon
    - mowojang
  not_found_min_count: 1

cache:
  prefix: "mc-lookup:"
  ttl: 3600
  negative_ttl: 300
