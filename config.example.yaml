app:
  name: mc-lookup
  env: dev

api:
  port: 8080
  read_timeout: 5
  write_timeout: 5

redis:
  addr: localhost:6379
  password: ""
  db: 0
  max_retries: -1

resolver:
  timeout: 5
  user_agent: "mc-lookup/1.0"
  strategy: "fallback" # race | fallback (default: fallback when omitted)
  list: # (race: acts as resolver toggle list, fallback: acts as resolver order list)
    - mojang
    - playerdb
    - ashcon
    - mowojang

cache:
  ttl: 3600
  prefix: "mc-lookup:"
